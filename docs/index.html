
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#151923">

<title>RC BLE Controller</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #151923;
    color: #fff;
    font-family: -apple-system, sans-serif;
    touch-action: none;
    user-select: none;
}

/* ヘッダー */

.ble-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    background: #202635;
    border-bottom: 1px solid #39445a;
}

.ble-title {
    font-size: 15px;
    font-weight: bold;
}

.ble-status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
    font-size: 13px;
    color: #b8c4d8;
}

/* 接続ランプ */

.lamp {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #777;
    flex-shrink: 0;
}

.lamp.disconnected {
    background: #888;
}

.lamp.connecting {
    background: #ffbf52;
}

.lamp.connected {
    background: #36df86;
    box-shadow: 0 0 8px #36df86;
}

.lamp.error {
    background: #ff4545;
}

/* BLEボタン */

.connect-button {
    min-width: 105px;
    padding: 12px;
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    color: white;
    background: #2878e8;
}

.connect-button.disconnect {
    background: #d94747;
}

.connect-button:disabled {
    opacity: 0.5;
}

/* コントローラー */

.main {
    display: flex;
    justify-content: space-around;
    align-items: center;
    min-height: calc(100dvh - 65px);
    padding: 15px;
    gap: 20px;
}

.controller {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

.name {
    font-size: 15px;
    color: #aebbd0;
    font-weight: bold;
}

/* スティック */

.stick {
    width: min(38vw, 240px);
    height: min(38vw, 240px);
    min-width: 130px;
    min-height: 130px;
    max-width: 240px;
    max-height: 240px;

    border-radius: 50%;
    background: #252e40;
    border: 3px solid #46536a;

    position: relative;
    touch-action: none;

    box-shadow: inset 0 0 25px #111827;
}

/* 中心線 */

.stick::before {
    content: "";
    position: absolute;
    width: 2px;
    height: 70%;
    left: 50%;
    top: 15%;
    background: #526079;
    transform: translateX(-50%);
}

.stick::after {
    content: "";
    position: absolute;
    width: 70%;
    height: 2px;
    top: 50%;
    left: 15%;
    background: #526079;
}

/* 操作ノブ */

.knob {
    width: 35%;
    height: 35%;
    border-radius: 50%;

    background: linear-gradient(
        145deg,
        #5c6c85,
        #303b50
    );

    border: 3px solid #8293ad;

    position: absolute;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    box-shadow: 0 5px 12px #0009;

    z-index: 2;
    pointer-events: none;
}

/* 数値表示 */

.value {
    font-family: monospace;
    font-size: 18px;
    color: #55c9ff;
    min-width: 130px;
    text-align: center;
}

/* 縦画面対応 */

@media (orientation: portrait) {

    .main {
        flex-direction: column;
        justify-content: center;
        gap: 20px;
    }

    .stick {
        width: min(36vw, 190px);
        height: min(36vw, 190px);
    }
}
</style>
</head>

<body>

<!-- BLEヘッダー -->

<header class="ble-header">

    <div>
        <div class="ble-title">
            RC BLE CONTROLLER
        </div>

        <div class="ble-status">
            <span id="statusLamp"
                  class="lamp disconnected"></span>

            <span id="status">
                未接続
            </span>
        </div>
    </div>

    <button id="connectBtn"
            class="connect-button">
        BLE 接続
    </button>

</header>


<!-- コントローラー -->

<div class="main">

    <!-- 前後スティック -->

    <div class="controller">

        <div class="name">
            THROTTLE
        </div>

        <div class="stick" id="throttleStick">

            <div class="knob" id="throttleKnob"></div>

        </div>

        <div class="value" id="throttleValue">
            FB : 0
        </div>

        <div class="name">
            前進 ↑ / 後退 ↓
        </div>

    </div>


    <!-- 左右スティック -->

    <div class="controller">

        <div class="name">
            STEERING
        </div>

        <div class="stick" id="steeringStick">

            <div class="knob" id="steeringKnob"></div>

        </div>

        <div class="value" id="steeringValue">
            LR : 0
        </div>

        <div class="name">
            左 ← / 右 →
        </div>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
